[project]
name = "heatcast"
version = "0.1.0"
description = "Probabilistic heatwave early warning for Maharashtra with Chronos time-series foundation models"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch", "chronos-forecasting>=2.0", "imdlib", "xarray", "pandas", "pyarrow",
  "numpy", "scipy", "statsmodels", "scikit-learn", "properscoring", "matplotlib",
  "streamlit", "requests", "pyyaml", "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
